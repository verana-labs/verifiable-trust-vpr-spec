<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verifiable Public Registry v3 Specification has moved</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="canonical" href="https://verana-labs.github.io/verifiable-trust-vpr-spec/versions/v3/">
    <meta name="robots" content="noindex">
    <!--
      The v3 spec moved to versions/v3/. This page keeps the old URL alive,
      because external sites link to it. The script runs first and carries the
      fragment across, so a deep link such as index-v3.html#term:foo still
      lands on the correct anchor. The meta refresh covers browsers that
      block scripts. Do not delete this file.
    -->
    <script>location.replace("versions/v3/" + location.hash);</script>
    <meta http-equiv="refresh" content="0; url=versions/v3/">
    <style>
      body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 34rem;
             padding: 0 1rem; line-height: 1.6; }
    </style>
  </head>
  <body>
    <h1>This page moved</h1>
    <p>The Verifiable Public Registry v3 Specification is now at
      <a href="versions/v3/">versions/v3/</a>.</p>
    <p>Your browser goes there automatically. Use the link if it does not.</p>
  </body>
</html>
